<!doctype html>
<html lang="es" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clips · Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4 text-slate-100">
  <form method="post" action="/login" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 p-8 shadow-2xl">
    <div class="text-4xl mb-2">🎬</div>
    <h1 class="text-2xl font-bold">Clips virales</h1>
    <p class="text-slate-400 text-sm mb-6">Acceso privado</p>
    {% if error %}<p class="mb-4 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 text-sm px-3 py-2">{{ error }}</p>{% endif %}
    <input type="password" name="password" placeholder="Contraseña" autofocus required
      class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 outline-none focus:ring-2 focus:ring-fuchsia-500">
    <button class="mt-4 w-full rounded-xl bg-gradient-to-r from-fuchsia-600 to-violet-600 py-3 font-semibold hover:opacity-90">Entrar</button>
  </form>
</body>
</html>
